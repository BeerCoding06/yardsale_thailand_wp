version: '3.8'

services:
  wordpress:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: yardsale_wordpress_prod
    restart: unless-stopped
    ports:
      - "8080:80"  # Changed to 8080 to avoid conflict with Nginx
    environment:
      # Database configuration (adjust as needed)
      - DB_HOST=db
      - DB_USER=wordpress
      - DB_PASSWORD=your_secure_password
      - DB_NAME=wordpress
      - WP_DEBUG=false
    volumes:
      # Persistent storage for uploads (important!)
      - wp_uploads:/var/www/html/wp-content/uploads
      # Persistent storage for cache
      - wp_cache:/var/www/html/wp-content/cache
      # wp-config.php can be mounted from host or use environment variables
      # - ./wp-config.prod.php:/var/www/html/wp-config.php:ro
    depends_on:
      - db
    networks:
      - wordpress_network

  db:
    image: mysql:8.0
    container_name: yardsale_db_prod
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: your_secure_password
      MYSQL_ROOT_PASSWORD: your_secure_root_password
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - wordpress_network
    command: --default-authentication-plugin=mysql_native_password

  nginx:
    image: nginx:alpine
    container_name: yardsale_nginx_prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - wordpress
    networks:
      - wordpress_network

volumes:
  wp_uploads:
    driver: local
  wp_cache:
    driver: local
  db_data:
    driver: local

networks:
  wordpress_network:
    driver: bridge
