version: '3.8'

services:
  wordpress:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: yardsale_wordpress_prod
    restart: unless-stopped
    environment:
      # Database configuration - using external database
      - DB_HOST=157.85.98.150:3306
      - DB_USER=root
      - DB_PASSWORD=RootBeer06032534
      - DB_NAME=nuxtcommerce_db
      - WP_DEBUG=false
      - WP_SITEURL_SUBDIRECTORY=/wordpress
    volumes:
      # Persistent storage for uploads (important!)
      - wp_uploads:/var/www/html/wp-content/uploads
      # Persistent storage for cache
      - wp_cache:/var/www/html/wp-content/cache
    networks:
      - traefik_network
    labels:
      # Traefik configuration
      - "traefik.enable=true"
      - "traefik.http.routers.wordpress.rule=PathPrefix(`/wordpress`)"
      - "traefik.http.routers.wordpress.entrypoints=web"
      - "traefik.http.services.wordpress.loadbalancer.server.port=80"
      # Strip /wordpress prefix before forwarding to container
      - "traefik.http.middlewares.wordpress-stripprefix.stripprefix.prefixes=/wordpress"
      # Pass headers (important for WordPress)
      - "traefik.http.middlewares.wordpress-headers.headers.customrequestheaders.X-Forwarded-Proto=https"
      # Combine middlewares
      - "traefik.http.routers.wordpress.middlewares=wordpress-stripprefix,wordpress-headers"
      # Health check (after strip prefix, it's just /)
      - "traefik.http.services.wordpress.loadbalancer.healthcheck.path=/"
      - "traefik.http.services.wordpress.loadbalancer.healthcheck.interval=30s"

volumes:
  wp_uploads:
    driver: local
  wp_cache:
    driver: local

networks:
  traefik_network:
    # Try to use existing network, or create new one
    # If Traefik uses a different network, change this to match
    # Common names: traefik, traefik_default, web, proxy
    external: false
    name: traefik_network
    driver: bridge
    # Alternative: use existing network
    # external: true
    # name: yardsale_thailand03_yardsale-network
