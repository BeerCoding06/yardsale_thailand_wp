version: '3.8'

services:
  wordpress:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: yardsale_wordpress_prod
    restart: unless-stopped
    environment:
      # Database configuration - using external database
      - DB_HOST=157.85.98.150:3306
      - DB_USER=root
      - DB_PASSWORD=RootBeer06032534
      - DB_NAME=nuxtcommerce_db
      - WP_DEBUG=false
      - WP_SITEURL_SUBDIRECTORY=/wordpress
    volumes:
      # Persistent storage for uploads (important!)
      - wp_uploads:/var/www/html/wp-content/uploads
      # Persistent storage for cache
      - wp_cache:/var/www/html/wp-content/cache
    networks:
      - traefik_network
    labels:
      # Traefik configuration
      - "traefik.enable=true"
      - "traefik.http.routers.wordpress.rule=PathPrefix(`/wordpress`)"
      - "traefik.http.routers.wordpress.entrypoints=web"
      - "traefik.http.services.wordpress.loadbalancer.server.port=80"
      # Pass headers (important for WordPress) - NO strip prefix, WordPress receives /wordpress/ path directly
      - "traefik.http.middlewares.wordpress-headers.headers.customrequestheaders.X-Forwarded-Proto=https"
      - "traefik.http.routers.wordpress.middlewares=wordpress-headers"
      # Health check (WordPress receives /wordpress/ path directly)
      - "traefik.http.services.wordpress.loadbalancer.healthcheck.path=/wordpress/"
      - "traefik.http.services.wordpress.loadbalancer.healthcheck.interval=30s"

volumes:
  wp_uploads:
    driver: local
  wp_cache:
    driver: local

networks:
  traefik_network:
    # Use the same network as other containers (yardsale_thailand03)
    external: true
    name: yardsale_thailand03_default
